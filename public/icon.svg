<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="gold-glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="gold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" floodColor="#E5B868" floodOpacity="0.8" />
    </filter>
    <linearGradient id="metal-chrome-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="25%" stopColor="#E2E8F0" />
      <stop offset="45%" stopColor="#94A3B8" />
      <stop offset="60%" stopColor="#F8FAFC" />
      <stop offset="80%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#334155" />
    </linearGradient>
    <linearGradient id="gunmetal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#36434E" />
      <stop offset="40%" stopColor="#28333C" />
      <stop offset="70%" stopColor="#212A31" />
      <stop offset="100%" stopColor="#171E23" />
    </linearGradient>
    <radialGradient id="gold-gem-glow" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stopColor="#FFF1D0" />
      <stop offset="35%" stopColor="#E5B868" />
      <stop offset="70%" stopColor="#B88A3D" />
      <stop offset="100%" stopColor="#5E4314" />
    </radialGradient>
    <linearGradient id="wing-silver-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="20%" stopColor="#CBD5E1" />
      <stop offset="50%" stopColor="#8A8A83" />
      <stop offset="80%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#212A31" />
    </linearGradient>
  </defs>

  <!-- 1. OUTER CIRCULAR BASE & CIRCUIT SHIELD -->
  <circle cx="300" cy="300" r="230" fill="url(#gunmetal-dark)" stroke="url(#metal-chrome-bright)" stroke-width="10" />
  <circle cx="300" cy="300" r="215" fill="none" stroke="#E5B868" stroke-width="3" opacity="0.8" />
  <circle cx="300" cy="300" r="200" fill="#171E23" stroke="#8A8A83" stroke-width="3" />

  <!-- Circuit Board Traces & Node Dots -->
  <g stroke="#E5B868" stroke-width="2.5" opacity="0.75" fill="none">
    <path d="M 220 110 L 240 130 L 360 130 L 380 110" />
    <path d="M 180 140 L 210 140 L 230 160" />
    <path d="M 420 140 L 390 140 L 370 160" />
    <path d="M 180 460 L 220 460 L 250 490" />
    <path d="M 420 460 L 380 460 L 350 490" />
    <circle cx="220" cy="110" r="4" fill="#E5B868" />
    <circle cx="380" cy="110" r="4" fill="#E5B868" />
    <circle cx="180" cy="140" r="4" fill="#E5B868" />
    <circle cx="420" cy="140" r="4" fill="#E5B868" />
    <circle cx="180" cy="460" r="4" fill="#E5B868" />
    <circle cx="420" cy="460" r="4" fill="#E5B868" />
  </g>

  <!-- 2. METALLIC SCULPTED WINGS (LEFT & RIGHT) -->
  <g id="left-wing">
    <path d="M 160 210 C 90 140 30 190 45 320 C 80 290 120 270 165 260 Z" fill="url(#wing-silver-grad)" stroke="url(#metal-chrome-bright)" stroke-width="2" />
    <path d="M 165 240 C 80 200 40 280 65 370 C 100 330 135 305 170 290 Z" fill="url(#wing-silver-grad)" stroke="#8A8A83" stroke-width="2" />
    <path d="M 170 270 C 100 260 70 330 95 400 C 125 365 155 335 180 320 Z" fill="url(#gunmetal-dark)" stroke="url(#metal-chrome-bright)" stroke-width="1.5" />
    <path d="M 160 210 C 90 140 30 190 45 320" fill="none" stroke="#E5B868" stroke-width="3" filter="url(#gold-glow-filter)" />
  </g>

  <g id="right-wing">
    <path d="M 440 210 C 510 140 570 190 555 320 C 520 290 480 270 435 260 Z" fill="url(#wing-silver-grad)" stroke="url(#metal-chrome-bright)" stroke-width="2" />
    <path d="M 435 240 C 520 200 560 280 535 370 C 500 330 465 305 430 290 Z" fill="url(#wing-silver-grad)" stroke="#8A8A83" stroke-width="2" />
    <path d="M 430 270 C 500 260 530 330 505 400 C 475 365 445 335 420 320 Z" fill="url(#gunmetal-dark)" stroke="url(#metal-chrome-bright)" stroke-width="1.5" />
    <path d="M 440 210 C 510 140 570 190 555 320" fill="none" stroke="#E5B868" stroke-width="3" filter="url(#gold-glow-filter)" />
  </g>

  <!-- 3. WING EMBOSSED TEXT: "JUST" ON LEFT & "PLAY" ON RIGHT -->
  <text x="142" y="312" fill="url(#metal-chrome-bright)" stroke="#171E23" stroke-width="2" font-size="46" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2" filter="url(#gold-shadow)">JUST</text>
  <text x="410" y="312" fill="url(#metal-chrome-bright)" stroke="#171E23" stroke-width="2" font-size="46" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2" filter="url(#gold-shadow)">PLAY</text>

  <!-- 4. CAMERA BODY & VIEWFINDER HOUSING -->
  <polygon points="250,165 350,165 375,205 225,205" fill="url(#gunmetal-dark)" stroke="url(#metal-chrome-bright)" stroke-width="3" />
  <rect x="270" y="150" width="60" height="15" rx="3" fill="url(#metal-chrome-bright)" />
  <rect x="200" y="190" width="30" height="15" rx="2" fill="url(#metal-chrome-bright)" stroke="#8A8A83" />
  <rect x="370" y="190" width="30" height="15" rx="2" fill="url(#metal-chrome-bright)" stroke="#8A8A83" />
  <circle cx="385" cy="197" r="5" fill="#171E23" stroke="#E5B868" stroke-width="1" />
  <polygon points="383,194 388,197 383,200" fill="#FFFFFF" />

  <rect x="170" y="205" width="260" height="170" rx="20" fill="url(#gunmetal-dark)" stroke="url(#metal-chrome-bright)" stroke-width="4" />
  <rect x="180" y="220" width="240" height="140" rx="12" fill="#212A31" stroke="#36434E" stroke-width="2" opacity="0.9" />
  <path d="M 180 360 L 420 360" stroke="#E5B868" stroke-width="3" filter="url(#gold-glow-filter)" />

  <!-- 5. LENS & FACETED GOLD GEM "1" -->
  <circle cx="300" cy="295" r="95" fill="url(#gunmetal-dark)" stroke="url(#metal-chrome-bright)" stroke-width="7" />
  <circle cx="300" cy="295" r="85" fill="#171E23" stroke="#8A8A83" stroke-width="3" />
  <circle cx="300" cy="295" r="72" fill="#212A31" stroke="#E5B868" stroke-width="3" />
  <circle cx="300" cy="295" r="58" fill="url(#gold-gem-glow)" stroke="#FFF1D0" stroke-width="3" filter="url(#gold-glow-filter)" />

  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.5">
    <polygon points="300,242 335,265 335,325 300,348 265,325 265,265" fill="none" />
    <line x1="300" y1="242" x2="300" y2="295" />
    <line x1="335" y1="265" x2="300" y2="295" />
    <line x1="335" y1="325" x2="300" y2="295" />
    <line x1="300" y1="348" x2="300" y2="295" />
    <line x1="265" y1="325" x2="300" y2="295" />
    <line x1="265" y1="265" x2="300" y2="295" />
  </g>

  <text x="300" y="316" fill="#212A31" stroke="#FFFFFF" stroke-width="2" font-size="62" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" filter="url(#gold-shadow)">1</text>

  <!-- 6. BOTTOM APEX SHIELD POINT -->
  <polygon points="300,510 260,430 340,430" fill="url(#gunmetal-dark)" stroke="url(#metal-chrome-bright)" stroke-width="4" />
  <line x1="300" y1="430" x2="300" y2="500" stroke="#E5B868" stroke-width="3" filter="url(#gold-glow-filter)" />
</svg>
